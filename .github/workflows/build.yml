name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不装 android-actions/setup-android：新镜像里 sdkmanager 已无 'tools' 包会报错。
      # ubuntu-latest 自带 SDK 且 licenses 已接受，AGP 会自动补 android-37 平台。
      - name: Show SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      # 仓库里 gradlew 没带可执行位，先补上，省得 setup-gradle 报校验警告
      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v5
        with:
          # AGP 9 需要 Gradle 9
          gradle-version: '9.3.0'

      - name: Assemble
        shell: bash
        # tee 一份到 build.log，同时靠 pipefail 保留 gradle 的退出码
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时先把尾部打出来，Actions 页面不用下载就能看到关键报错
      - name: Build log tail
        if: failure()
        shell: bash
        run: |
          echo '```'
          tail -n 200 build.log || true
          echo '```'

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build.log
            build/reports/problems/problems-report.html
            app/build/reports/**

      - uses: actions/upload-artifact@v5
        with:
          name: LyricPatch-apk
          path: app/build/outputs/apk/release/*.apk

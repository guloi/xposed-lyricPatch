name: build

on:
  push:
    branches: ['**']
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（填了就发 latest，留空只更新 ci 预发布）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 手动运行时可以把 tag 写在输入框里；push 触发时这里是空的
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          name="$(echo "${{ inputs.tag }}" | tr -d '[:space:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不装 android-actions/setup-android：新镜像里 sdkmanager 已无 'tools' 包会报错。
      # ubuntu-latest 自带 SDK 且 licenses 已接受，AGP 会自动补 android-37 平台。
      - name: Show SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      # 正式签名：把 repo-lyricPatchKey/lyricpatch.jks 转 base64 存进 secrets.KEYSTORE_BASE64。
      # 没配 secret 时跳过，build.gradle 会退回 debug 签名。
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/lyricpatch.jks

      # 仓库里 gradlew 没带可执行位，先补上，省得 setup-gradle 报校验警告
      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v5
        with:
          # AGP 9 需要 Gradle 9
          gradle-version: '9.3.0'

      - name: Assemble
        shell: bash
        env:
          KEYSTORE_FILE: lyricpatch.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # tee 一份到 build.log，同时靠 pipefail 保留 gradle 的退出码
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时先把尾部打出来，Actions 页面不用下载就能看到关键报错
      - name: Build log tail
        if: failure()
        shell: bash
        run: |
          echo '```'
          tail -n 200 build.log || true
          echo '```'

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build.log
            build/reports/problems/problems-report.html
            app/build/reports/**

      - uses: actions/upload-artifact@v5
        with:
          name: LyricPatch-apk
          path: app/build/outputs/apk/release/*.apk

      # 分支 push / 手动运行但没填 tag：覆盖同一个 ci 预发布
      - name: Publish CI build
        if: github.ref_type == 'branch' && steps.tag.outputs.name == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci
          name: CI 构建
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            此为 CI 自动构建，不是正式发布版本。

            提交：`${{ github.sha }}`
            分支：`${{ github.ref_name }}`
          files: app/build/outputs/apk/release/*.apk

      # 推 tag，或手动运行填了 tag：发正式 release，并设为 latest
      - name: Publish release
        if: github.ref_type == 'tag' || steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name != '' && steps.tag.outputs.name || github.ref_name }}
          name: ${{ steps.tag.outputs.name != '' && steps.tag.outputs.name || github.ref_name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            CI 预览版（每次 push 自动更新）：https://github.com/${{ github.repository }}/releases/tag/ci
          files: app/build/outputs/apk/release/*.apk

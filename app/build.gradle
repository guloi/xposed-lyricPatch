plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lyricpatch'
    // 用 35 + AGP 8.7.3 这个确定能跑的组合；我们这个模块用不到 36 的 API
    compileSdk 35

    defaultConfig {
        applicationId "com.lyricpatch"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // libxposed API：用工程内的编译期 stub（不进 APK，运行时由框架提供）
    compileOnly project(':apistub')
}

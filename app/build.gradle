plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.lyricpatch'
    // 跟 ROM 对齐：这台机子的 SystemUI 就是 SDK 37（Android 17）
    compileSdk 37

    defaultConfig {
        applicationId "com.lyricpatch"
        minSdk 29
        targetSdk 37
        versionCode 67
        versionName "4.36"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }

    lint {
        abortOnError false
    }
}

// Kotlin 由 AGP 内置提供：jvmTarget 取自上面的 compileOptions（17）

dependencies {
    // libxposed API（Maven Central，注意版本号是 102.0.0）
    compileOnly 'io.github.libxposed:api:102.0.0'

    // 设置界面：Compose + Material3（Expressive 风格）
    // BOM 先停在 2024.12.01：跟 Kotlin 2.1 配套已验证
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 只用到核心图标（箭头），别拉 icons-extended
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

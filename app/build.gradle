plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 版本号只有一个来源：src/main/java/com/lyricpatch/lib/Version.java
// 改版本只改那里，这里自动读，不用两处同步
def versionSource = file('src/main/java/com/lyricpatch/lib/Version.java').text
def appVersionCode = (versionSource =~ /CODE\s*=\s*(\d+)/)[0][1] as int
def appVersionName = (versionSource =~ /NAME\s*=\s*"([^"]+)"/)[0][1]

// module.prop 是 LSPosed 读的模块信息，version 也从 Version.java 注入。
// 构建前自动同步（内容一样就不写），不用手动改第二处。
def modulePropFile = file('src/main/resources/META-INF/xposed/module.prop')
tasks.register('syncModulePropVersion') {
    def versionName = appVersionName
    doLast {
        def lines = modulePropFile.readLines('UTF-8')
        def index = lines.findIndexOf { it.startsWith('version=') }
        def line = "version=$versionName"
        if (index >= 0) {
            lines[index] = line
        } else {
            lines << line
        }
        def updated = lines.join('\n') + '\n'
        if (modulePropFile.getText('UTF-8') != updated) {
            modulePropFile.write(updated, 'UTF-8')
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'syncModulePropVersion'
}

android {
    namespace 'com.lyricpatch'
    // 跟 ROM 对齐：这台机子的 SystemUI 就是 SDK 37（Android 17）
    compileSdk 37

    sourceSets {
        // 按语言分家：Java 在 src/main/java，Kotlin 在 src/main/kotlin。
        // 包名不变，两边互相引用由 Kotlin 插件统一编译。
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.lyricpatch"
        minSdk 29
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        release {
            // CI 里由 workflow 把 secrets 解码到 app/lyricpatch.jks；
            // 本地没这些变量时保持未配置，下面的 debug 会兑底
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // R8 全量裁剪：未用类/方法/字段全丢掉，Compose 的收益最大
            minifyEnabled true
            // 配合 R8 删掉未引用的 res（本项目 res 很小，顺手开）
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // 有正式 key 就用它，否则退回 debug（fork / 无 secrets 时也能出包）。
            // 注意必须用赋值：写成 signingConfig (... ? ...) Groovy 会当成方法调用，
            // 把 Boolean 当参数塞给 setSigningConfig，直接 ClassCastException。
            def ks = System.getenv("KEYSTORE_FILE")
            signingConfig = (ks != null && file(ks).exists())
                    ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }

    lint {
        abortOnError false
    }
}

// Kotlin 由 AGP 内置提供：jvmTarget 取自上面的 compileOptions（17）

dependencies {
    // libxposed API（Maven Central，注意版本号是 102.0.0）
    compileOnly 'io.github.libxposed:api:102.0.0'

    // 设置界面：Compose + Material3（Expressive 风格）
    // BOM 先停在 2024.12.01：跟 Kotlin 2.1 配套已验证
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

